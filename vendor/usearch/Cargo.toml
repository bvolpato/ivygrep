[package]
edition = "2021"
name = "ivygrep-usearch"
version = "2.24.0-ivygrep.2"
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
build = "build.rs"
include = [
    "/rust/**",
    "/include/**",
    "/fp16/include/**",
    "/build.rs",
    "/IVYGREP_PATCH.md",
    "/LICENSE",
    "/README.md",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ivygrep-maintained USearch fork"
documentation = "https://docs.rs/ivygrep-usearch"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/bvolpato/ivygrep"

[features]
default = ["fp16lib"]
fp16lib = []
openmp = []

[lib]
name = "usearch"
path = "rust/lib.rs"

[dependencies.cxx]
version = "1.0.160"

[dev-dependencies.fork_union]
version = "2.1.1"

[dev-dependencies.rand]
version = "0.9.1"

[dev-dependencies.rand_chacha]
version = "0.9.0"

[dev-dependencies.rand_distr]
version = "0.5.1"

[build-dependencies.cxx-build]
version = "1.0.160"
