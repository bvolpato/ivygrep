[package]
name = "ivygrep-tantivy-sstable"
version = "0.7.0-ivygrep.1"
edition = "2024"
license = "MIT"
homepage = "https://github.com/quickwit-oss/tantivy"
repository = "https://github.com/quickwit-oss/tantivy"
keywords = ["search", "information", "retrieval", "sstable"]
categories = ["database-implementations", "data-structures", "compression"]
description = "sstables for tantivy"

[lib]
name = "tantivy_sstable"
path = "src/lib.rs"

[dependencies]
common = {version= "0.11", git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42", package="tantivy-common"}
futures-util = "0.3.30"
itertools = "0.14.0"
tantivy-bitpacker = { version= "0.10", git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42" }
tantivy-fst = "0.5"
# experimental gives us access to Decompressor::upper_bound
zstd = { version = "0.14.3", optional = true, features = ["experimental"] }

[features]
zstd-compression = ["zstd"]

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false }
names = "0.14"
rand = "0.9"

[[bench]]
name = "stream_bench"
harness = false

[[bench]]
name = "ord_to_term"
harness = false

