[package]
edition = "2021"
name = "ivygrep-tree-sitter-haskell"
version = "0.23.1-ivygrep.1"
authors = ["Max Brunsfeld <maxbrunsfeld@gmail.com>"]
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
    "IVYGREP_PATCH.md",
    "LICENSE",
    "README.md",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ivygrep-maintained Haskell grammar for tree-sitter"
readme = "README.md"
keywords = [
    "incremental",
    "parsing",
    "tree-sitter",
    "haskell",
]
categories = [
    "parsing",
    "text-editors",
]
license = "MIT"
repository = "https://github.com/bvolpato/ivygrep"

[lib]
name = "tree_sitter_haskell"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[dev-dependencies.tree-sitter]
version = "0.23"

[build-dependencies.cc]
version = "1.1.15"
