[package]
categories=["algorithms", "science"]
description="ivygrep-maintained Candle text embedding fork"
edition="2021"
homepage="https://github.com/bvolpato/ivygrep"
keywords=["cuda", "embeddings", "huggingface", "search", "vectors"]
license="MIT"
name="ivygrep-candle-embed"
repository="https://github.com/bvolpato/ivygrep"
version="0.1.4-ivygrep.1"

[lib]
name="candle_embed"
path="src/lib.rs"

[dependencies]
anyhow="1.0.82"
candle={version="0.10.2", package="candle-core", default-features=false}
candle-transformers="0.10.2"
candle_nn={version="0.10.2", package="candle-nn", default-features=false}
hf-hub={package="ivygrep-hf-hub", path="../hf-hub", version="=0.3.2-ivygrep.1", features=["tokio"]}
serde_json="1.0.116"
tokenizers="0.19.1"

[features]
cuda=["candle/cuda", "candle_nn/cuda"]
metal=["candle/metal", "candle_nn/metal"]
default=["cuda"]
