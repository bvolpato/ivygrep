[package]
name = "ivygrep"
version = "1.2.12"
edition = "2024"
description = "Local semantic search for code, notes, and memories with context packs for coding agents"
license = "MIT"
homepage = "https://bvolpato.github.io/ivygrep"
repository = "https://github.com/bvolpato/ivygrep"
readme = "README.md"
keywords = ["grep", "search", "semantic", "code-search", "mcp"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
include = [
    ".cargo/config.toml",
    "assets/query_aliases.toml",
    "assets/windows/ivygrep.manifest",
    "benchmarks/public/reranker_model.json",
    "build.rs",
    "Cargo.lock",
    "Cargo.toml",
    "docs/architecture.md",
    "LICENSE",
    "README.md",
    "src/**",
    "tests/fixtures/reranker_feature_contract.json",
    "web/dist/**",
]

[[bin]]
name = "ig"
path = "src/main.rs"

[features]
default = ["neural"]
neural = ["dep:candle_embed", "dep:candle-core", "dep:hf-hub", "dep:tokenizers"]
accelerate = ["neural"]
metal = ["neural"]
cuda = ["neural", "candle-core/cuda", "candle_embed/cuda"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
dirs = "6.0"
fs2 = "0.4.3"
grep-matcher = "0.1"
grep-regex = "0.1"
regex = "1.5"
regex-syntax = "0.8"
grep-searcher = "0.1"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
notify = "8.2"
parking_lot = "0.12"
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
smallvec = "1.15"
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42", version = "0.27.0" }
tokio = { version = "1.50", features = ["full"] }
toml_edit = "0.25.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
num_cpus = "1.16"
ratatui = "0.30.0"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-input = "0.15.3"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
arboard = "3.4.0"
libc = "0.2"
lru = "0.18.2"
# Keep exact-pinned because parser recovery changes can affect public-code retrieval.
tree-sitter = "=0.26.13"
tree-sitter-rust = "0.24.1"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-swift = "0.7.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-scala = "0.26.0"
tree-sitter-bash = "0.25.1"
tree-sitter-haskell = { package = "ivygrep-tree-sitter-haskell", path = "vendor/tree-sitter-haskell", version = "=0.23.1-ivygrep.1" }
tree-sitter-ocaml = "0.25.0"
tree-sitter-lua = "0.5.0"
tree-sitter-dart = "0.2.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-starlark = "1.3.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-zig = "1.1.2"
streaming-iterator = "0.1.9"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13"
candle_embed = { package = "ivygrep-candle-embed", path = "vendor/candle_embed", version = "=0.1.4-ivygrep.2", default-features = false, optional = true }
candle-core = { version = "0.11.0", optional = true }
hf-hub = { package = "ivygrep-hf-hub", path = "vendor/hf-hub", version = "=0.3.2-ivygrep.2", optional = true }
tokenizers = { version = "0.23.1", optional = true }
usearch = { package = "ivygrep-usearch", path = "vendor/usearch", version = "=2.24.0-ivygrep.2", default-features = false, features = ["fp16lib"] }

[dev-dependencies]
assert_cmd = "2.2"
criterion = "0.8.2"
fs_extra = "1.3"
insta = { version = "1.46", features = ["yaml", "redactions"] }
predicates = "3.1"
proptest = "1.10"
serial_test = "4.0"
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(windows))'.dependencies]
shlex = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
candle_embed = { package = "ivygrep-candle-embed", path = "vendor/candle_embed", version = "=0.1.4-ivygrep.2", default-features = false, optional = true, features = ["metal"] }
candle-core = { version = "0.11.0", optional = true, features = ["accelerate", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = false
lto = "thin"
strip = "symbols"

# gemm-f16 0.19.0's ARM FP16 helpers need inlining inside their runtime-
# dispatched target-feature functions. Keep application debug builds portable
# without globally requiring FP16 instructions on older ARM CPUs.
[profile.dev.package.gemm-f16]
opt-level = 1

[[bench]]
name = "indexer_bench"
harness = false
