# actionlint v1.7.12 support is tracked at https://github.com/rhysd/actionlint/issues/711.
paths:
  .github/workflows/public-retrieval.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/retrieval-matrix\.yml" at "uses" is not following the format'
  .github/workflows/release.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/retrieval-matrix\.yml" at "uses" is not following the format'
