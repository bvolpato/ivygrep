name: Relevance

# Opt-in relevance gate (#20). Runs on PRs that touch ranking/indexing/eval
# code or the labeled query set, plus manual dispatch. Uses the deterministic
# hash path so the gate is stable across runs and runners (no model download,
# no SIMD float variance); it still catches regressions in the shared fusion /
# boosting / chunking logic. A bounded public neural sample covers model-backed
# routing and retrieval without running the full release matrix on every PR.
on:
  pull_request:
    branches: [main]
    # Any source change can shift ranking (chunking, fusion, filtering, glob
    # handling, etc.), so trigger on all of src/ rather than a hand-picked
    # allowlist that's easy to let drift. Tests don't affect runtime relevance,
    # so they're excluded — except the labeled query set, which is an input.
    paths:
      - "src/**/*.rs"
      - "assets/**"
      - "vendor/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "benchmarks/public/reranker_model.json"
      - "scripts/eval_relevance.py"
      - "scripts/eval_code_retrieval.py"
      - "scripts/bench_context_retrieval.py"
      - "tests/fixtures/retrieval/**"
      - "tests/fixtures/context_retrieval_tasks.json"
      - "tests/fixtures/ivygrep_relevance_queries.json"
      - ".github/workflows/relevance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  relevance-gate:
    name: Relevance gates (routing matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "relevance"
          cache-bin: "false"

      # Hash-only build: faster (no ONNX/candle) and all the gate needs, since
      # it evaluates the deterministic hash path.
      - name: Build ig (hash-only)
        run: cargo build --release --locked --no-default-features --bin ig

      # Keep margin below the current deterministic hash baseline (MRR 0.95,
      # p@1 0.91, recall@5 0.96). Exact-baseline gates fail when unrelated
      # source files change corpus statistics and provide no regression budget.
      - name: Relevance gate
        run: |
          python3 scripts/eval_relevance.py \
            --skip-build \
            --binary target/release/ig \
            --check --min-mrr 0.90 --min-p1 0.85 --min-recall5 0.95

      - name: Public retrieval fixture
        run: |
          python3 scripts/eval_code_retrieval.py \
            --dataset tests/fixtures/retrieval \
            --binary target/release/ig \
            --mode hash \
            --output retrieval-results.json \
            --min-ndcg-at-10 0.75 \
            --min-mrr-at-10 0.75 \
            --min-precision-at-5 0.18 \
            --min-recall-at-20 0.95

      # Absolute floors alone are gameable: the five most frequent gold files
      # in the fixture, returned as a constant answer, score mean recall 0.78
      # and clear --min-context-recall 0.70 without reading the task. The
      # constant baseline is scored and reported next to ivygrep so the gap is
      # visible in every run. It is not enforced yet: on the current 12-task
      # fixture one task is 0.083 recall and ANN build variance flips results
      # between runs (measured 0.771 vs 0.903 on the same commit), so a margin
      # gate (--min-margin-over-baseline) needs a larger fixture or averaged
      # runs first.
      - name: Context retrieval evidence
        run: |
          uv run scripts/bench_context_retrieval.py \
            --binary target/release/ig \
            --repo . \
            --tasks-from tests/fixtures/context_retrieval_tasks.json \
            --output context-retrieval-results.json \
            --baseline constant-topk \
            --baseline-k 5 \
            --min-context-recall 0.70 \
            --min-context-primary-recall 0.75 \
            --min-context-test-recall 1.0 \
            --max-context-zero-recall-rate 0.17 \
            --min-context-covered-roles 6.8 \
            --min-context-recall-per-1k-tokens 0.11

      - name: Build ig (neural smoke)
        run: cargo build --release --locked --bin ig

      - name: Retrieval routing matrix
        run: |
          uv run scripts/run_public_benchmark_matrix.py \
            --profile model-bakeoff \
            --modes hash,hybrid,blended,neural \
            --runs 1 \
            --datasets-root "$RUNNER_TEMP/public-datasets" \
            --work-root "$RUNNER_TEMP/routing-matrix" \
            --binary target/release/ig \
            --skip-build \
            --output routing-matrix-results.json
          jq '
            .summary
            | with_entries(
                .value |= .metrics
                | .value |= {
                    ndcg_at_10: .ndcg_at_10.mean,
                    mrr_at_10: .mrr_at_10.mean,
                    recall_at_20: .recall_at_20.mean,
                    no_hit_rate: .no_hit_rate.mean
                  }
              )
          ' routing-matrix-results.json
          # ANN graph construction varies slightly across runner CPUs. These
          # floors retain about 10% regression margin below the repeated local
          # baseline while the deterministic hash gate above remains strict.
          jq -e '
            [
              .summary[]
              | .metrics
              | (
                  .ndcg_at_10.mean >= 0.53
                  and .mrr_at_10.mean >= 0.47
                  and .recall_at_20.mean >= 0.70
                  and .no_hit_rate.mean == 0
                )
            ]
            | if all
              then true
              else error("retrieval routing matrix fell below quality floor")
              end
          ' routing-matrix-results.json

      - name: Neural self-repository relevance gate
        run: |
          python3 scripts/eval_relevance.py \
            --skip-build \
            --binary target/release/ig \
            --neural \
            --no-audit-recall \
            --check --min-mrr 0.90 --min-p1 0.85 --min-recall5 0.90

      - name: Upload public retrieval result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-retrieval-results
          path: |
            retrieval-results.json
            context-retrieval-results.json
            routing-matrix-results.json
            ${{ runner.temp }}/routing-matrix/*.json
