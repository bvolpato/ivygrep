name: Windows Watch Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      IVYGREP_NO_AUTOSPAWN: "1"
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "test"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Repeat real watcher lifecycle with event tracing
        shell: bash
        run: |
          for iteration in {1..20}; do
            echo "Watcher iteration $iteration"
            cargo test --locked --no-default-features --lib linked_worktree_watcher_bootstraps_missing_external_git_info_directory -- --nocapture
          done
