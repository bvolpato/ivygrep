name: Cross-Platform E2E

on:
  # Manual trigger with architecture selection
  workflow_dispatch:
    inputs:
      architectures:
        description: "Architectures to test (comma-separated)"
        required: false
        default: "linux-x86_64,linux-aarch64,macos-arm64,windows-x86_64"
        type: string
      test_scope:
        description: "Test scope"
        required: false
        default: "full"
        type: choice
        options:
          - full      # cargo test --lib --bins --tests
          - smoke     # Binary smoke test only (fast)
          - stress    # Include stress tests

  # Run on releases to validate every published binary
  push:
    tags:
      - "v*"

  # Weekly scheduled run to catch regressions early
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  IVYGREP_NO_AUTOSPAWN: "1"

permissions:
  contents: read

jobs:
  # ── Native runners (fast, no emulation) ─────────────────────────────
  native-linux-x86_64:
    name: "E2E: Linux x86_64 (native)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'linux-x86_64')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: System info
        run: |
          uname -a
          head -5 /proc/meminfo
          cat /proc/sys/fs/inotify/max_user_watches
          nproc

      - name: Build
        run: cargo build --locked --release
        env:
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"

      - name: Run full test suite
        if: github.event.inputs.test_scope != 'smoke'
        run: cargo test --locked --lib --bins --tests
        env:
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"

      - name: Bootstrap stress fixtures
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_scope == 'stress'
        run: ./scripts/bootstrap_stress_fixtures.sh

      - name: Run stress tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_scope == 'stress'
        run: cargo test --locked --test stress_harness -- --ignored
        env:
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"

      - name: E2E documented procedures
        run: |
          IG_BIN="$PWD/target/release/ig"
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

  native-macos-arm64:
    name: "E2E: macOS ARM64 (native)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'macos-arm64')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: System info
        run: |
          uname -a
          sysctl hw.memsize hw.ncpu
          arch

      - name: Build
        run: cargo build --locked --release --features accelerate
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run full test suite
        if: github.event.inputs.test_scope != 'smoke'
        run: cargo test --locked --lib --bins --tests --features accelerate
        env:
          RUSTFLAGS: "-D warnings"

      - name: E2E documented procedures
        run: |
          IG_BIN="$PWD/target/release/ig"
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

  native-macos-intel:
    name: "E2E: macOS x86_64 (native)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'macos-x86_64')
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: System info
        run: |
          uname -a
          sysctl hw.memsize hw.ncpu
          arch

      - name: Build
        run: cargo build --locked --release --features accelerate
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run full test suite
        if: github.event.inputs.test_scope != 'smoke'
        run: cargo test --locked --lib --bins --tests --features accelerate
        env:
          RUSTFLAGS: "-D warnings"

      - name: E2E documented procedures
        run: |
          IG_BIN="$PWD/target/release/ig"
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

  # ── Cross-architecture via QEMU (slower but covers aarch64 on Linux) ─
  cross-linux-aarch64:
    name: "E2E: Linux aarch64 (QEMU)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'linux-aarch64')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: arm64
          cache-image: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        run: cross build --locked --release --target aarch64-unknown-linux-musl

      # Match the shipped ARM binary profile; Candle's debug build emits
      # fullfp16-only assembly for a baseline aarch64 target. Daemon autospawn
      # uses current_exe(), which identifies QEMU under emulation; native jobs
      # cover its recovery test.
      - name: Run release-profile tests with cross
        if: github.event.inputs.test_scope != 'smoke'
        run: cross test --locked --release --lib --bins --tests --target aarch64-unknown-linux-musl -- --skip query_revives_watcher_after_daemon_goes_offline

      - name: E2E smoke test (QEMU)
        run: |
          BINARY="./target/aarch64-unknown-linux-musl/release/ig"

          # Verify binary is actually aarch64
          file "$BINARY" | grep -qi "aarch64\|ARM" || { echo "FAIL: binary is not aarch64"; file "$BINARY"; exit 1; }

          # Run through Docker with QEMU emulation
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e IVYGREP_NO_AUTOSPAWN=1 \
            alpine:latest sh -c '
              set -e
              IG="/workspace/target/aarch64-unknown-linux-musl/release/ig"

              echo "=== Architecture ==="
              uname -m

              sh scripts/e2e_procedures.sh --binary "$IG"
            '

  # ── Hash-only mode (no neural/ONNX — tests portability) ─────────────
  hash-only-linux:
    name: "E2E: Linux x86_64 (hash-only, no neural)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'linux-x86_64')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build (no default features)
        run: cargo build --locked --release --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run full test suite (hash-only)
        if: github.event.inputs.test_scope != 'smoke'
        run: cargo test --locked --lib --bins --tests --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: E2E documented procedures (hash-only)
        run: |
          IG_BIN="$PWD/target/release/ig"
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

  native-windows-x86_64:
    name: "E2E: Windows x86_64 (portable vectors)"
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.architectures, 'windows-x86_64')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build portable hash-only binary
        run: cargo build --locked --release --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run unit and integration tests
        if: github.event.inputs.test_scope != 'smoke'
        run: cargo test --locked --lib --bins --tests --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: E2E documented procedures
        shell: bash
        run: ./scripts/e2e_procedures.sh --binary "$PWD/target/release/ig.exe"

  # ── Summary ─────────────────────────────────────────────────────────
  summary:
    name: "E2E Summary"
    needs:
      - native-linux-x86_64
      - native-macos-arm64
      - native-macos-intel
      - cross-linux-aarch64
      - hash-only-linux
      - native-windows-x86_64
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          LINUX_X86_RESULT: ${{ needs.native-linux-x86_64.result }}
          MACOS_ARM_RESULT: ${{ needs.native-macos-arm64.result }}
          MACOS_X86_RESULT: ${{ needs.native-macos-intel.result }}
          LINUX_ARM_RESULT: ${{ needs.cross-linux-aarch64.result }}
          HASH_ONLY_RESULT: ${{ needs.hash-only-linux.result }}
          WINDOWS_RESULT: ${{ needs.native-windows-x86_64.result }}
        run: |
          {
            echo "## Cross-Platform E2E Results"
            echo ""
            echo "| Platform | Result |"
            echo "|----------|--------|"
            echo "| Linux x86_64 (native) | $LINUX_X86_RESULT |"
            echo "| macOS ARM64 (native) | $MACOS_ARM_RESULT |"
            echo "| macOS x86_64 (native) | $MACOS_X86_RESULT |"
            echo "| Linux aarch64 (QEMU) | $LINUX_ARM_RESULT |"
            echo "| Linux x86_64 (hash-only) | $HASH_ONLY_RESULT |"
            echo "| Windows x86_64 (portable vectors) | $WINDOWS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for failures
        if: >-
          needs.native-linux-x86_64.result == 'failure' ||
          needs.native-macos-arm64.result == 'failure' ||
          needs.native-macos-intel.result == 'failure' ||
          needs.cross-linux-aarch64.result == 'failure' ||
          needs.hash-only-linux.result == 'failure' ||
          needs.native-windows-x86_64.result == 'failure'
        run: |
          echo "❌ One or more E2E jobs failed!"
          exit 1
