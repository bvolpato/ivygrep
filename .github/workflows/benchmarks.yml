name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required: ${{ steps.benchmark-changes.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "bench"
          cache-bin: "false"

      - name: Determine benchmark base
        id: benchmark-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch benchmark base
        if: steps.benchmark-base.outputs.ref != ''
        env:
          BENCHMARK_BASE_REF: ${{ steps.benchmark-base.outputs.ref }}
        run: |
          git cat-file -e "${BENCHMARK_BASE_REF}^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "${BENCHMARK_BASE_REF}"

      - name: Classify benchmark-relevant changes
        id: benchmark-changes
        if: steps.benchmark-base.outputs.ref != ''
        env:
          BENCHMARK_BASE_REF: ${{ steps.benchmark-base.outputs.ref }}
        run: |
          if git diff --quiet "$BENCHMARK_BASE_REF" HEAD -- \
            .cargo/ \
            assets/query_aliases.toml \
            benchmarks/public/reranker_model.json \
            Cargo.lock \
            Cargo.toml \
            benches/ \
            build.rs \
            rust-toolchain.toml \
            scripts/benchmark_guard.py \
            scripts/criterion_to_benchmark_data.py \
            src/ \
            vendor/; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard critical benchmark regressions
        if: steps.benchmark-changes.outputs.required == 'true'
        env:
          BENCHMARK_BASE_REF: ${{ steps.benchmark-base.outputs.ref }}
          PAIRED_BENCHMARK_DIR: ${{ runner.temp }}/paired-benchmarks
        run: |
          mkdir -p "$PAIRED_BENCHMARK_DIR"
          python3 scripts/benchmark_guard.py \
            --baseline-ref "$BENCHMARK_BASE_REF" \
            --bench-target indexer_bench \
            --bench-name indexer/incremental_reindex_no_change \
            --threshold 1.15 \
            --output "$PAIRED_BENCHMARK_DIR/incremental-no-change.json"
          python3 scripts/benchmark_guard.py \
            --baseline-ref "$BENCHMARK_BASE_REF" \
            --bench-target indexer_bench \
            --bench-name indexer_bulk/fresh_index_30k_chunks \
            --threshold 1.20 \
            --output "$PAIRED_BENCHMARK_DIR/fresh-index.json"
          python3 scripts/benchmark_guard.py \
            --baseline-ref "$BENCHMARK_BASE_REF" \
            --bench-target indexer_bench \
            --bench-name base_search_patterns/hybrid_complex_phrase_1000_files \
            --threshold 1.20 \
            --output "$PAIRED_BENCHMARK_DIR/hybrid-search.json"
          python3 scripts/benchmark_guard.py \
            --baseline-ref "$BENCHMARK_BASE_REF" \
            --bench-target indexer_bench \
            --bench-name critical_journeys/vector_search_in_50k_hot \
            --threshold 1.20 \
            --output "$PAIRED_BENCHMARK_DIR/vector-search-hot.json"
          python3 scripts/benchmark_guard.py \
            --baseline-ref "$BENCHMARK_BASE_REF" \
            --bench-target indexer_bench \
            --bench-name critical_journeys/exact_filtered_vector_top_50_in_50k_hot \
            --threshold 1.20 \
            --output "$PAIRED_BENCHMARK_DIR/vector-filtered-exact.json"

      - name: Report paired benchmark deltas
        if: always() && steps.benchmark-changes.outputs.required == 'true'
        env:
          PAIRED_BENCHMARK_DIR: ${{ runner.temp }}/paired-benchmarks
        run: |
          {
            echo "### Paired benchmark guards"
            echo
            echo "Base and head run on the same runner. Ratios above 1.0 are slower."
            echo
            echo "| Benchmark | Base | Head | Ratio | Limit |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            for result in "$PAIRED_BENCHMARK_DIR"/*.json; do
              jq -r '"| `\(.bench)` | \(.baseline_median_ns / 1000000 | . * 100 | round / 100) ms | \(.current_median_ns / 1000000 | . * 100 | round / 100) ms | \(.ratio * 1000 | round / 1000)x | \(.threshold)x |"' "$result"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paired benchmark results
        if: always() && steps.benchmark-changes.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paired-benchmark-guards
          path: ${{ runner.temp }}/paired-benchmarks/*.json

      - name: Report skipped benchmarks
        if: steps.benchmark-base.outputs.ref != '' && steps.benchmark-changes.outputs.required != 'true'
        env:
          BENCHMARK_BASE_REF: ${{ steps.benchmark-base.outputs.ref }}
        run: |
          {
            echo "### Paired benchmark guards"
            echo
            echo "Skipped because no benchmark-relevant inputs changed from \`$BENCHMARK_BASE_REF\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-criterion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark-changes.outputs.required == 'true'
        run: cargo install cargo-criterion --version 1.1.0 --locked

      - name: Run benchmarks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark-changes.outputs.required == 'true'
        run: cargo criterion --locked --message-format=json > criterion-output.json

      - name: Convert Criterion JSON to Custom Benchmark Format
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark-changes.outputs.required == 'true'
        run: |
          python3 scripts/criterion_to_benchmark_data.py \
            criterion-output.json benchmark-data.json \
            --min-benchmarks 10

      - name: Restore Cargo.lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark-changes.outputs.required == 'true'
        run: git restore Cargo.lock || true

      - name: Upload shared-runner history input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark-changes.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-history-input
          path: benchmark-data.json
          if-no-files-found: error
          retention-days: 1

  publish-history:
    name: Publish shared-runner history
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.benchmark.outputs.required == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download shared-runner history input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-history-input

      - name: Publish informational shared-runner history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Rust shared-runner history (informational)
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json

          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
