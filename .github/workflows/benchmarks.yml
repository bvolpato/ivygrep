name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"
          cache-bin: "false"

      - name: Determine benchmark base
        id: benchmark-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard critical benchmark regressions
        if: steps.benchmark-base.outputs.ref != ''
        run: |
          python3 scripts/benchmark_guard.py \
            --baseline-ref "${{ steps.benchmark-base.outputs.ref }}" \
            --bench-target indexer_bench \
            --bench-name indexer/incremental_reindex_no_change \
            --threshold 1.15

      - name: Install cargo-criterion
        run: cargo install cargo-criterion

      - name: Run benchmarks
        run: cargo criterion

      - name: Convert Criterion Estimates to Custom Benchmark Format
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = []
          criterion_root = Path("target/criterion")

          for estimates_path in sorted(criterion_root.glob("**/new/estimates.json")):
            name = "/".join(estimates_path.relative_to(criterion_root).parts[:-2])
            if not name:
              print(f"{estimates_path}: could not derive benchmark name", file=sys.stderr)
              sys.exit(1)

            estimates = json.loads(estimates_path.read_text(encoding="utf-8"))
            median = estimates.get("median", {}).get("point_estimate")
            if median is None:
              print(f"{estimates_path}: missing median.point_estimate", file=sys.stderr)
              sys.exit(1)

            # Criterion medians are less sensitive to scheduler/VM tail spikes than
            # means, especially for microbenchmarks that complete in microseconds.
            data.append({"name": name, "value": round(float(median) / 1000, 2), "unit": "µs"})

          if not data:
            print("no Criterion estimates found under target/criterion", file=sys.stderr)
            sys.exit(1)

          with open("benchmark-data.json", "w", encoding="utf-8") as f:
            json.dump(data, f)
          PY


      - name: Restore Cargo.lock
        run: git restore Cargo.lock || true

      - name: Track Benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json

          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@bvolpato'
          comment-always: true
