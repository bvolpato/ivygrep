name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"
          cache-bin: "false"

      - name: Determine benchmark base
        id: benchmark-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch benchmark base
        if: steps.benchmark-base.outputs.ref != ''
        env:
          BENCHMARK_BASE_REF: ${{ steps.benchmark-base.outputs.ref }}
        run: |
          git cat-file -e "${BENCHMARK_BASE_REF}^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "${BENCHMARK_BASE_REF}"

      - name: Guard critical benchmark regressions
        if: steps.benchmark-base.outputs.ref != ''
        run: |
          python3 scripts/benchmark_guard.py \
            --baseline-ref "${{ steps.benchmark-base.outputs.ref }}" \
            --bench-target indexer_bench \
            --bench-name indexer/incremental_reindex_no_change \
            --threshold 1.15

      - name: Install cargo-criterion
        run: cargo install cargo-criterion

      - name: Run benchmarks
        run: cargo criterion --message-format=json > criterion-output.json

      - name: Convert Criterion JSON to Custom Benchmark Format
        run: |
          python3 scripts/criterion_to_benchmark_data.py \
            criterion-output.json benchmark-data.json \
            --min-benchmarks 10

      - name: Restore Cargo.lock
        run: git restore Cargo.lock || true

      - name: Track Benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json

          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@bvolpato'
          comment-always: true
