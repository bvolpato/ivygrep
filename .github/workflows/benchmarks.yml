name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"
          cache-bin: "false"

      - name: Determine benchmark base
        id: benchmark-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard critical benchmark regressions
        if: steps.benchmark-base.outputs.ref != ''
        run: |
          python3 scripts/benchmark_guard.py \
            --baseline-ref "${{ steps.benchmark-base.outputs.ref }}" \
            --bench-target indexer_bench \
            --bench-name indexer/incremental_reindex_no_change \
            --threshold 1.15

      - name: Install cargo-criterion
        run: cargo install cargo-criterion

      - name: Run benchmarks
        run: cargo criterion --message-format=json > criterion-output.json

      - name: Convert Criterion JSON to Custom Benchmark Format
        run: |
          python3 - <<'PY'
          import json
          import sys

          data = []
          parse_errors = 0

          with open("criterion-output.json", encoding="utf-8") as f:
            for line_no, line in enumerate(f, 1):
              if not line.strip():
                continue
              try:
                obj = json.loads(line)
              except json.JSONDecodeError as exc:
                parse_errors += 1
                print(f"criterion-output.json:{line_no}: invalid JSON: {exc}", file=sys.stderr)
                continue
              if obj.get("reason") == "benchmark-complete":
                name = obj.get("id")
                ns = obj.get("mean", {}).get("estimate")
                if not name or ns is None:
                  print(f"criterion-output.json:{line_no}: incomplete benchmark-complete event", file=sys.stderr)
                  parse_errors += 1
                  continue
                data.append({"name": name, "value": round(float(ns) / 1000, 2), "unit": "µs"})

          if parse_errors:
            sys.exit(1)
          if not data:
            print("no benchmark-complete events found in criterion output", file=sys.stderr)
            sys.exit(1)

          with open("benchmark-data.json", "w", encoding="utf-8") as f:
            json.dump(data, f)
          PY


      - name: Restore Cargo.lock
        run: git restore Cargo.lock || true

      - name: Track Benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json

          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@bvolpato'
          comment-always: true
