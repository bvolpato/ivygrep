name: Million-Scale Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "15 4 * * 0"
  workflow_dispatch:
    inputs:
      scale:
        description: "Generated public corpus size"
        required: true
        default: "million"
        type: choice
        options:
          - hundred-thousand
          - million

permissions:
  contents: read

jobs:
  paired-benchmark:
    name: Paired generated-corpus benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select paired benchmark parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_SCALE: ${{ inputs.scale }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            {
              echo "base=$PR_BASE_SHA"
              echo "files=1000"
              echo "runs=3"
            } >> "$GITHUB_OUTPUT"
            if git diff --quiet "$PR_BASE_SHA" HEAD -- \
              .cargo/ \
              .github/workflows/million-scale.yml \
              assets/query_aliases.toml \
              benchmarks/public/reranker_model.json \
              build.rs \
              Cargo.lock \
              Cargo.toml \
              scripts/bench_million_chunks.py \
              scripts/soak_daemon.py \
              scripts/check_public_benchmark_privacy.py \
              scripts/compare_million_benchmarks.py \
              src/ \
              vendor/; then
              echo "required=false" >> "$GITHUB_OUTPUT"
            else
              echo "required=true" >> "$GITHUB_OUTPUT"
            fi
          else
            scale="${INPUT_SCALE:-million}"
            files=10000
            if [[ "$scale" == "hundred-thousand" ]]; then
              files=1000
            fi
            {
              echo "base=$(git rev-parse HEAD^)"
              echo "files=$files"
              echo "runs=2"
              echo "required=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped benchmark
        if: steps.parameters.outputs.required != 'true'
        env:
          BASE_SHA: ${{ steps.parameters.outputs.base }}
        run: |
          {
            echo "### Paired generated-corpus benchmark"
            echo
            echo "Skipped because no benchmark-relevant inputs changed from \`$BASE_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        if: steps.parameters.outputs.required == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install uv
        if: steps.parameters.outputs.required == 'true'
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Cache Cargo dependencies
        if: steps.parameters.outputs.required == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "million-scale"
          cache-bin: "false"

      - name: Build base and head
        if: steps.parameters.outputs.required == 'true'
        env:
          BASE_SHA: ${{ steps.parameters.outputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ivygrep-base" "$BASE_SHA"
          shared_target="$GITHUB_WORKSPACE/target"
          mkdir -p "$RUNNER_TEMP/base-target/release" "$RUNNER_TEMP/head-target/release"
          cargo build --release --locked \
            --manifest-path "$RUNNER_TEMP/ivygrep-base/Cargo.toml" \
            --target-dir "$shared_target"
          cp "$shared_target/release/ig" "$RUNNER_TEMP/base-target/release/ig"
          cargo build --release --locked --target-dir "$shared_target"
          cp "$shared_target/release/ig" "$RUNNER_TEMP/head-target/release/ig"

      - name: Run paired generated-corpus trials
        if: steps.parameters.outputs.required == 'true'
        env:
          BASE_SHA: ${{ steps.parameters.outputs.base }}
          FILES: ${{ steps.parameters.outputs.files }}
          RUNS: ${{ steps.parameters.outputs.runs }}
        run: |
          mkdir -p benchmark-results
          for run in $(seq 1 "$RUNS"); do
            run_base() {
              uv run scripts/bench_million_chunks.py \
                --corpus "$RUNNER_TEMP/generated-public-corpus" \
                --home "$RUNNER_TEMP/base-home-$run" \
                --binary "$RUNNER_TEMP/base-target/release/ig" \
                --files "$FILES" \
                --query-samples 100 \
                --source-commit "$BASE_SHA" \
                --output "benchmark-results/baseline-$run.json"
              rm -rf "$RUNNER_TEMP/base-home-$run"
            }
            run_head() {
              uv run scripts/bench_million_chunks.py \
                --corpus "$RUNNER_TEMP/generated-public-corpus" \
                --home "$RUNNER_TEMP/head-home-$run" \
                --binary "$RUNNER_TEMP/head-target/release/ig" \
                --files "$FILES" \
                --query-samples 100 \
                --source-commit "$GITHUB_SHA" \
                --output "benchmark-results/current-$run.json"
              rm -rf "$RUNNER_TEMP/head-home-$run"
            }
            if (( run % 2 )); then
              run_base
              run_head
            else
              run_head
              run_base
            fi
          done

      - name: Compare paired generated-corpus trials
        id: comparison
        if: steps.parameters.outputs.required == 'true'
        run: |
          set +e
          python3 scripts/compare_million_benchmarks.py \
            --baseline benchmark-results/baseline-*.json \
            --current benchmark-results/current-*.json \
            --significant-regression-ratio 1.10 \
            --output benchmark-results/comparison-initial.json
          comparison_status=$?
          set -e
          if (( comparison_status == 0 )); then
            cp benchmark-results/comparison-initial.json benchmark-results/comparison.json
            echo "confirmation_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "confirmation_required=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Paired generated-corpus benchmark"
              echo
              echo "Initial comparison reported a regression. Running confirmation trials in reverse order."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Confirm reported regressions in reverse order
        if: >-
          steps.parameters.outputs.required == 'true' &&
          steps.comparison.outputs.confirmation_required == 'true'
        env:
          BASE_SHA: ${{ steps.parameters.outputs.base }}
          FILES: ${{ steps.parameters.outputs.files }}
        run: |
          for run in 1 2; do
            run_base() {
              uv run scripts/bench_million_chunks.py \
                --corpus "$RUNNER_TEMP/generated-public-corpus" \
                --home "$RUNNER_TEMP/base-confirmation-home-$run" \
                --binary "$RUNNER_TEMP/base-target/release/ig" \
                --files "$FILES" \
                --query-samples 100 \
                --source-commit "$BASE_SHA" \
                --output "benchmark-results/baseline-confirmation-$run.json"
              rm -rf "$RUNNER_TEMP/base-confirmation-home-$run"
            }
            run_head() {
              uv run scripts/bench_million_chunks.py \
                --corpus "$RUNNER_TEMP/generated-public-corpus" \
                --home "$RUNNER_TEMP/head-confirmation-home-$run" \
                --binary "$RUNNER_TEMP/head-target/release/ig" \
                --files "$FILES" \
                --query-samples 100 \
                --source-commit "$GITHUB_SHA" \
                --output "benchmark-results/current-confirmation-$run.json"
              rm -rf "$RUNNER_TEMP/head-confirmation-home-$run"
            }
            if (( run % 2 )); then
              run_head
              run_base
            else
              run_base
              run_head
            fi
          done
          set +e
          python3 scripts/compare_million_benchmarks.py \
            --baseline benchmark-results/baseline-confirmation-*.json \
            --current benchmark-results/current-confirmation-*.json \
            --significant-regression-ratio 1.10 \
            --output benchmark-results/comparison-confirmation.json
          comparison_status=$?
          set -e
          cp benchmark-results/comparison-confirmation.json benchmark-results/comparison.json
          if (( comparison_status == 0 )); then
            echo "Confirmation trials did not reproduce the initial regression." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Confirmation trials reproduced the initial regression." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$comparison_status"

      - name: Validate benchmark evidence
        if: always() && steps.parameters.outputs.required == 'true'
        run: |
          python3 scripts/check_public_benchmark_privacy.py benchmark-results

      - name: Run scheduled daemon soak
        if: steps.parameters.outputs.required == 'true' && github.event_name != 'pull_request'
        run: |
          uv run scripts/soak_daemon.py \
            --binary "$RUNNER_TEMP/head-target/release/ig" \
            --repo . \
            --duration 300 \
            --output benchmark-results/daemon-soak.json

      - name: Upload benchmark evidence
        if: always() && steps.parameters.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: million-scale-performance
          path: benchmark-results
