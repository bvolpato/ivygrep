name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit locked dependencies
        id: audit
        run: |
          set -Eeuo pipefail
          audit_report="$RUNNER_TEMP/cargo-audit.json"
          audit_summary="$RUNNER_TEMP/cargo-audit-summary.md"
          audit_status=0
          if cargo audit --deny yanked --deny unsound --json > "$audit_report"; then
            :
          else
            audit_status=$?
          fi

          if [[ ! -s "$audit_report" ]] || ! jq -e 'type == "object"' "$audit_report" >/dev/null; then
            echo "report_created=false" >> "$GITHUB_OUTPUT"
            echo "cargo audit did not produce JSON output" >&2
            {
              echo "### Rust dependency audit"
              echo
              echo "cargo audit did not produce valid JSON output."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if ((audit_status == 0)); then
              audit_status=1
            fi
            exit "$audit_status"
          fi

          echo "report_created=true" >> "$GITHUB_OUTPUT"
          jq -r '
            . as $report
            | "### Rust dependency audit\n\n"
              + "Policy: `--deny yanked --deny unsound`; unmaintained warnings are informational.\n\n"
              + "#### Finding counts\n\n"
              + "- Vulnerabilities: \(($report.vulnerabilities.list // []) | length)\n"
              + "- Unsound warnings: \(($report.warnings.unsound // []) | length)\n"
              + "- Yanked warnings: \(($report.warnings.yanked // []) | length)\n"
              + "- Unmaintained warnings (informational): \(($report.warnings.unmaintained // []) | length)\n\n"
              + ([
                  ["Vulnerabilities", ($report.vulnerabilities.list // [])],
                  ["Unsound", ($report.warnings.unsound // [])],
                  ["Yanked", ($report.warnings.yanked // [])],
                  ["Unmaintained (informational)", ($report.warnings.unmaintained // [])]
                ]
                | map(
                    .[0] as $label
                    | .[1] as $findings
                    | "#### \($label) (\($findings | length))\n\n"
                      + if ($findings | length) == 0 then
                          "No findings.\n\n"
                        else
                          ($findings | map(
                            "- `\(.package.name // "unknown")@\(.package.version // "unknown")`"
                            + (if .advisory.id then " (\(.advisory.id))" else "" end)
                            + (if .advisory.title then ": \(.advisory.title)" else "" end)
                            + (if (.versions.patched // [] | length) > 0 then
                                 " (patched: \(.versions.patched | join(", ")))"
                               else "" end)
                          ) | join("\n")) + "\n\n"
                        end
                  ) | join(""))
          ' "$audit_report" > "$audit_summary"

          tee -a "$GITHUB_STEP_SUMMARY" < "$audit_summary"
          echo "Full cargo-audit JSON report:"
          jq . "$audit_report"
          exit "$audit_status"

      - name: Upload cargo-audit JSON
        if: always() && steps.audit.outputs.report_created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-audit.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan current tree
        run: |
          "$RUNNER_TEMP/bin/gitleaks" dir . --no-banner --redact

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.14

      - name: Install zizmor
        run: uv run --no-project --exclude-newer "7 days" --with zizmor==1.25.2 zizmor --min-severity low .github/workflows
