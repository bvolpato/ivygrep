name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit locked dependencies
        run: |
          set -Eeuo pipefail
          audit_report="$RUNNER_TEMP/cargo-audit.json"
          audit_status=0
          cargo audit --deny yanked --deny unsound --json > "$audit_report" || audit_status=$?
          if [[ -s "$audit_report" ]]; then
            unmaintained_count="$(jq '.warnings.unmaintained | length' "$audit_report")"
            {
              echo "### Rust dependency audit"
              echo
              echo "Denied classes: yanked and unsound. Unmaintained dependencies remain informational until a safe replacement exists."
              echo
              echo "Unmaintained warnings: $unmaintained_count"
              if ((unmaintained_count > 0)); then
                jq -r '.warnings.unmaintained[] | "- `\(.package.name) \(.package.version)` (\(.advisory.id)): \(.advisory.title)"' "$audit_report"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo audit did not produce JSON output" >&2
          fi
          exit "$audit_status"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan current tree
        run: |
          "$RUNNER_TEMP/bin/gitleaks" dir . --no-banner --redact

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install zizmor
        run: python3 -m pip install --disable-pip-version-check zizmor==1.25.2

      - name: Audit workflow security
        run: zizmor --min-severity low .github/workflows
