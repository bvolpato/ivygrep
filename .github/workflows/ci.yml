name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  IVYGREP_NO_AUTOSPAWN: "1"

permissions:
  contents: read

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          shared-key: "lint"
          cache-bin: "false"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        run: shellcheck build.sh test.sh bench.sh scripts/bootstrap_stress_fixtures.sh scripts/e2e_procedures.sh scripts/e2e_neural_backend.sh scripts/stress_large_repo.sh

      - name: Test Python harnesses
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Clippy lints
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-cpu=x86-64-v3"
            name: "Linux (Neural AVX2)"
          - os: ubuntu-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Linux (Hash-only)"
          - os: macos-latest
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS ARM (Neural Accelerate)"
          - os: macos-15-intel
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS Intel (Neural Accelerate)"
          - os: macos-latest
            cargo_flags: "--features accelerate,metal"
            rust_flags: "-D warnings"
            name: "macOS ARM (Metal opt-in)"
          - os: macos-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "macOS ARM (Hash-only)"
          - os: windows-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Windows x86_64 (Portable vectors)"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          shared-key: "test"
          cache-bin: "false"

      - name: Run unit & integration tests
        shell: bash
        run: |
          read -r -a cargo_flags <<< "$CARGO_FLAGS"
          cargo test --locked --lib --bins --tests "${cargo_flags[@]}"
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
          RUSTFLAGS: ${{ matrix.rust_flags }}

  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-cpu=x86-64-v3"
          - os: ubuntu-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
          - os: macos-latest
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
          - os: macos-15-intel
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
          - os: macos-latest
            cargo_flags: "--features accelerate,metal"
            rust_flags: "-D warnings"
            validate_backend: "Candle Metal"
          - os: macos-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
          - os: windows-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          shared-key: "release"
          cache-bin: "false"

      - name: Build release binary
        shell: bash
        run: |
          read -r -a cargo_flags <<< "$CARGO_FLAGS"
          cargo build --locked --release "${cargo_flags[@]}"
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
          RUSTFLAGS: ${{ matrix.rust_flags }}

      - name: Smoke test
        shell: bash
        run: |
          EXE_SUFFIX=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE_SUFFIX=".exe"
          fi
          
          IG_BIN="$PWD/target/release/ig${EXE_SUFFIX}"
          
          echo "==== Version ===="
          $IG_BIN --version
          
          echo "==== Documented procedure smoke ===="
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

          echo "==== Daemon/local equivalence ===="
          PYTHON=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=python
          fi
          BENCH_HOME=/tmp/ivygrep-daemon-equivalence
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BENCH_HOME="$RUNNER_TEMP/ivygrep-daemon-equivalence"
          fi
          "$PYTHON" scripts/check_daemon_equivalence.py \
            --skip-build \
            --binary "$IG_BIN" \
            --bench-home "$BENCH_HOME"

      - name: Validate local accelerator execution
        if: matrix.validate_backend == 'Candle Metal'
        run: ./scripts/e2e_neural_backend.sh --binary "$PWD/target/release/ig" --expect-backend "${{ matrix.validate_backend }}" --allow-backend "Candle CPU (Accelerate)"
