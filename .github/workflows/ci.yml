name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  IVYGREP_NO_AUTOSPAWN: "1"

permissions:
  contents: read

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "lint"
          cache-bin: "false"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: ShellCheck scripts
        run: shellcheck install.sh build.sh test.sh bench.sh scripts/bootstrap_stress_fixtures.sh scripts/e2e_all.sh scripts/e2e_web_ui.sh scripts/e2e_procedures.sh scripts/e2e_neural_backend.sh scripts/e2e_x86_baseline.sh scripts/e2e_cached_model.sh scripts/stress_large_repo.sh

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Lint Markdown
        run: pnpm dlx markdownlint-cli2@0.23.2

      - name: Verify web frontend
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web check
          pnpm -C web build
          git diff --exit-code -- web/dist

      - name: Test Python harnesses
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify generated benchmark dashboard
        run: |
          python3 scripts/render_evidence_dashboard.py
          git diff --exit-code -- \
            docs/benchmarks/evidence-dashboard.json \
            docs/benchmarks/evidence-dashboard.html

      - name: Clippy lints
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features accelerate,metal -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-cpu=x86-64-v3"
            name: "Linux (Neural AVX2)"
          - os: ubuntu-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Linux (Hash-only)"
          - os: ubuntu-24.04-arm
            # Match the shipped profile; baseline ARM Candle debug assembly needs fullfp16.
            cargo_flags: "--release"
            rust_flags: "-D warnings"
            name: "Linux ARM64 (Neural CPU)"
          - os: ubuntu-24.04-arm
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Linux ARM64 (Hash-only)"
          - os: macos-latest
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS ARM (Neural Accelerate)"
          - os: macos-15-intel
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS Intel (Neural Accelerate)"
          - os: macos-latest
            cargo_flags: "--features accelerate,metal"
            rust_flags: "-D warnings"
            name: "macOS ARM (Metal opt-in)"
          - os: macos-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "macOS ARM (Hash-only)"
          - os: windows-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-feature=+crt-static"
            name: "Windows x86_64 (Neural CPU)"
          - os: windows-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings -C target-feature=+crt-static"
            name: "Windows x86_64 (Hash-only fallback)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Parse PowerShell installer
        if: matrix.name == 'Windows x86_64 (Hash-only fallback)'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Smoke test PowerShell installer
        if: matrix.name == 'Windows x86_64 (Hash-only fallback)'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:IVYGREP_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "ivygrep-installer"
          & ./install.ps1
          & (Join-Path $env:IVYGREP_INSTALL_DIR "ig.exe") --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "test"
          cache-bin: "false"

      - name: Run unit & integration tests
        shell: bash
        run: |
          read -r -a cargo_flags <<< "$CARGO_FLAGS"
          cargo test --locked --lib --bins --tests "${cargo_flags[@]}"
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
          RUSTFLAGS: ${{ matrix.rust_flags }}

  build:
    name: Build release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-cpu=x86-64-v3"
            name: "Linux (Neural AVX2)"
          - os: ubuntu-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Linux (Hash-only)"
          - os: ubuntu-24.04-arm
            cargo_flags: ""
            rust_flags: "-D warnings"
            name: "Linux ARM64 (Neural CPU)"
            validate_backend: "StaticEmbedding token mean via Rust"
            model_profile: "static"
          - os: ubuntu-24.04-arm
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "Linux ARM64 (Hash-only)"
          - os: macos-latest
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS ARM (Neural Accelerate)"
          - os: macos-15-intel
            cargo_flags: "--features accelerate"
            rust_flags: "-D warnings"
            name: "macOS Intel (Neural Accelerate)"
          - os: macos-latest
            cargo_flags: "--features accelerate,metal"
            rust_flags: "-D warnings"
            name: "macOS ARM (Metal opt-in)"
            validate_backend: "Candle Metal"
            allow_backend: "Candle CPU (Accelerate)"
            model_profile: "general"
          - os: macos-latest
            cargo_flags: "--no-default-features"
            rust_flags: "-D warnings"
            name: "macOS ARM (Hash-only)"
          - os: windows-latest
            cargo_flags: ""
            rust_flags: "-D warnings -C target-feature=+crt-static"
            name: "Windows x86_64 (Neural CPU)"
            validate_backend: "StaticEmbedding token mean via Rust"
            model_profile: "static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "release"
          cache-bin: "false"

      - name: Build release binary
        shell: bash
        run: |
          read -r -a cargo_flags <<< "$CARGO_FLAGS"
          cargo build --locked --release "${cargo_flags[@]}"
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
          RUSTFLAGS: ${{ matrix.rust_flags }}

      - name: Smoke test
        shell: bash
        run: |
          EXE_SUFFIX=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE_SUFFIX=".exe"
          fi
          
          IG_BIN="$PWD/target/release/ig${EXE_SUFFIX}"
          
          echo "==== Version ===="
          $IG_BIN --version
          
          echo "==== Documented procedure smoke ===="
          ./scripts/e2e_procedures.sh --binary "$IG_BIN"

          echo "==== Daemon/local equivalence ===="
          PYTHON=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=python
          fi
          BENCH_ROOT="$("$PYTHON" -c 'import tempfile; print(tempfile.gettempdir())')"
          BENCH_HOME="$BENCH_ROOT/ivygrep-daemon-equivalence"
          "$PYTHON" scripts/check_daemon_equivalence.py \
            --skip-build \
            --binary "$IG_BIN" \
            --bench-home "$BENCH_HOME"

      - name: Install uv for neural model caching
        if: matrix.validate_backend != ''
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate local neural execution
        if: matrix.validate_backend != ''
        shell: bash
        run: |
          HF_HOME="$RUNNER_TEMP/ivygrep-ci-hf-cache"
          export HF_HOME
          uv run scripts/cache_neural_model.py \
            --profile "$MODEL_PROFILE" \
            --cache "$HF_HOME"
          EXE_SUFFIX=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE_SUFFIX=".exe"
          fi
          args=(
            --binary "$PWD/target/release/ig${EXE_SUFFIX}"
            --expect-backend "$EXPECTED_BACKEND"
          )
          if [[ -n "$ALLOWED_BACKEND" ]]; then
            args+=(--allow-backend "$ALLOWED_BACKEND")
          fi
          args+=(--expect-file "src/lib.rs" --check-worktree)
          HTTP_PROXY=http://127.0.0.1:9 \
          HTTPS_PROXY=http://127.0.0.1:9 \
          ALL_PROXY=http://127.0.0.1:9 \
          NO_PROXY='' \
            ./scripts/e2e_neural_backend.sh "${args[@]}"
        env:
          ALLOWED_BACKEND: ${{ matrix.allow_backend }}
          EXPECTED_BACKEND: ${{ matrix.validate_backend }}
          IVYGREP_MODEL_PROFILE: ${{ matrix.model_profile }}
          MODEL_PROFILE: ${{ matrix.model_profile }}

      - name: Install Playwright Chromium for Web UI E2E
        if: runner.os == 'Linux' && matrix.cargo_flags == ''
        run: |
          npm install -g pnpm@10.33.0
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install chromium

      - name: Run bundled Web UI browser E2E
        if: runner.os == 'Linux' && matrix.cargo_flags == ''
        run: ./scripts/e2e_web_ui.sh --binary "$PWD/target/release/ig"

  ci-gate:
    name: CI gate
    if: always() && !cancelled()
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
