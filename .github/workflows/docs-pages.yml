name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docs to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync static docs
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages ../gh-pages origin/gh-pages
          rsync -a --delete --exclude .git --exclude assets --exclude dev docs/ ../gh-pages/
          rsync -a --delete assets/ ../gh-pages/assets/
          touch ../gh-pages/.nojekyll

      - name: Commit docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ../gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No docs changes to publish"
          else
            git commit -m "docs: publish static site"
            git pull --rebase origin gh-pages
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages || {
              git pull --rebase origin gh-pages
              git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
            }
          fi
