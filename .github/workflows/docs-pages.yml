name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build static site artifact
        run: |
          mkdir -p _site
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
            git archive --format=tar origin/gh-pages dev 2>/dev/null | tar -x -C _site || true
          fi
          rsync -ac --delete --exclude assets --exclude dev docs/ _site/
          rsync -ac --delete assets/ _site/assets/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
