name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.archive_name }}
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE_FORMAT: ${{ matrix.archive }}
      ARCHIVE_NAME_SUFFIX: ${{ matrix.archive_name }}
      EXTRA_FEATURES: ${{ matrix.extra_features }}
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.use_cross }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-x86_64-musl
            archive: tar.gz
            use_cross: true

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-aarch64-musl
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive_name: macos-x86_64
            archive: tar.gz
            extra_features: accelerate
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_name: macos-aarch64
            archive: tar.gz
            extra_features: accelerate
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_name: windows-x86_64
            archive: zip
            cargo_flags: --no-default-features

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          build_args=(--locked --release --target "$TARGET")
          if [ -n "$CARGO_FLAGS" ]; then
            read -r -a cargo_flags <<< "$CARGO_FLAGS"
            build_args+=("${cargo_flags[@]}")
          fi
          if [ -n "$EXTRA_FEATURES" ]; then
            build_args+=(--features "$EXTRA_FEATURES")
          fi
          if [ "$USE_CROSS" = "true" ]; then
            cross build "${build_args[@]}"
          else
            cargo build "${build_args[@]}"
          fi
        shell: bash
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}

      - name: Enforce release size budget
        shell: bash
        run: |
          EXE_SUFFIX=""
          if [[ "$TARGET" == *"windows"* ]]; then
            EXE_SUFFIX=".exe"
          fi
          PYTHON=python3
          if [[ "$TARGET" == *"windows"* ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/check_release_size.py \
            "target/${TARGET}/release/ig${EXE_SUFFIX}" \
            --max-mib 80

      - name: Set up QEMU
        if: "contains(matrix.target, 'aarch64') && contains(matrix.runner, 'ubuntu-latest')"
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          cache-image: false

      - name: Smoke test
        shell: bash
        env:
          IVYGREP_NO_AUTOSPAWN: "1"
        run: |
          EXE_SUFFIX=""
          if [[ "$TARGET" == *"windows"* ]]; then
            EXE_SUFFIX=".exe"
          fi
          IG_BIN="$PWD/target/${TARGET}/release/ig${EXE_SUFFIX}"

          # Basic sanity. Cross-compiled Linux aarch64 binaries are validated by
          # e2e-cross-platform.yml under QEMU, not executed on this x86 runner.
          if [[ "$TARGET" != *"windows"* ]]; then
            file "$IG_BIN"
          fi
          if [[ "$TARGET" != "aarch64-unknown-linux-musl" ]]; then
            "$IG_BIN" --version
            "$IG_BIN" --help > /dev/null
          fi

          # Cross-compiled Linux aarch64 binaries are tested under QEMU in
          # e2e-cross-platform.yml. Every runnable release binary must pass the
          # documented CLI procedure smoke test here.
          if [[ "$TARGET" == "aarch64-unknown-linux-musl" ]]; then
            echo "Skipping index test for Linux aarch64 release binary (tested under QEMU in e2e-cross-platform.yml)"
          else
            ./scripts/e2e_procedures.sh --binary "$IG_BIN"
            PYTHON=python3
            if [[ "$TARGET" == *"windows"* ]]; then
              PYTHON=python
            fi
            BENCH_ROOT="$("$PYTHON" -c 'import tempfile; print(tempfile.gettempdir())')"
            BENCH_HOME="$BENCH_ROOT/ivygrep-release-daemon-equivalence"
            "$PYTHON" scripts/check_daemon_equivalence.py \
              --skip-build \
              --binary "$IG_BIN" \
              --bench-home "$BENCH_HOME"
          fi

      - name: Package archive
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="ivygrep-${TAG}-${ARCHIVE_NAME_SUFFIX}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          
          EXE_SUFFIX=""
          if [[ "$TARGET" == *"windows"* ]]; then
            EXE_SUFFIX=".exe"
          fi
          
          cp "target/${TARGET}/release/ig${EXE_SUFFIX}" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE* 2>/dev/null "dist/${ARCHIVE_NAME}/" || true
          cd dist
          
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            echo "ARCHIVE_PATH=dist/${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            echo "ARCHIVE_PATH=dist/${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Enforce archive size budget
        shell: bash
        run: |
          PYTHON=python3
          if [[ "$TARGET" == *"windows"* ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/check_release_size.py "$ARCHIVE_PATH" --max-mib 80

      - name: Compute SHA256
        shell: bash
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            SHA=$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')
          else
            SHA=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')
          fi
          echo "SHA256=${SHA}" >> "$GITHUB_ENV"
          
          # Use proper file extension depending on the generated archive format
          ARCHIVE_EXT="tar.gz"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            ARCHIVE_EXT="zip"
          fi
          echo "${SHA}  ${ARCHIVE_NAME}.${ARCHIVE_EXT}" > "${ARCHIVE_PATH}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          find artifacts -name '*.sha256' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Extract Release Notes
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="[${VERSION}]" '/^## / { if (p) { exit }; if (index($2, ver)) { p=1; next } } p' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: ${{ steps.extract_notes.outputs.notes_file }}
          files: release-assets/*
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: false

      - name: Compute SHA256 values
        id: sha
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          get_sha() {
            local pattern=$1
            local file
            file=$(find artifacts -name "${pattern}" -path '*.sha256' | head -1)
            if [ -f "$file" ]; then
              awk '{print $1}' "$file"
            else
              # Fallback: compute from the archive
              local archive
              archive=$(find artifacts -name "${pattern%.sha256}" | head -1)
              sha256sum "$archive" | awk '{print $1}'
            fi
          }

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha_linux_amd64_musl=$(get_sha "ivygrep-${TAG}-linux-x86_64-musl.tar.gz.sha256")"
            echo "sha_linux_arm64_musl=$(get_sha "ivygrep-${TAG}-linux-aarch64-musl.tar.gz.sha256")"
            echo "sha_macos_amd64=$(get_sha "ivygrep-${TAG}-macos-x86_64.tar.gz.sha256")"
            echo "sha_macos_arm64=$(get_sha "ivygrep-${TAG}-macos-aarch64.tar.gz.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bvolpato/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Generate formula (default — static/musl on Linux)
        shell: bash
        env:
          FORMULA_TAG: ${{ steps.sha.outputs.tag }}
          FORMULA_VERSION: ${{ steps.sha.outputs.version }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.sha_linux_amd64_musl }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.sha_linux_arm64_musl }}
          SHA_MACOS_AMD64: ${{ steps.sha.outputs.sha_macos_amd64 }}
          SHA_MACOS_ARM64: ${{ steps.sha.outputs.sha_macos_arm64 }}
        run: |
          cat > homebrew-tap/Formula/ivygrep.rb << FORMULA_EOF
          # typed: false
          # frozen_string_literal: true

          # This file is auto-generated by the ivygrep release workflow. DO NOT EDIT.
          class Ivygrep < Formula
            desc "Semantic grep for codebases — hybrid lexical + vector search, local-only"
            homepage "https://github.com/bvolpato/ivygrep"
            version "${FORMULA_VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_AMD64}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_ARM64}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-linux-x86_64-musl.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-linux-aarch64-musl.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "ig"
            end

            test do
              (testpath/"hello.rs").write('fn hello() -> &str { "world" }')
              system "#{bin}/ig", "--help"
            end
          end
          FORMULA_EOF

      - name: Commit & push formulas
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.sha.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f Formula/ivygrep-static.rb Formula/ivygrep-gnu.rb 2>/dev/null || true
          git add Formula/ivygrep.rb
          if git diff --cached --quiet; then
            echo "Formulas already up to date, nothing to commit"
          else
            git commit -m "ivygrep ${RELEASE_TAG}: update formulas"
            git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bvolpato/homebrew-tap.git" HEAD:main
          fi
