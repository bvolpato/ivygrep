name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.archive_name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      ARCHIVE_FORMAT: ${{ matrix.archive }}
      ARCHIVE_NAME_SUFFIX: ${{ matrix.archive_name }}
      BINARY_NAME: ${{ matrix.binary_name }}
      CARGO_FLAGS: ${{ matrix.cargo_flags }}
      EXTRA_FEATURES: ${{ matrix.extra_features }}
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.use_cross }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-x86_64-musl
            archive: tar.gz
            binary_name: ig
            use_cross: true

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-aarch64-musl
            archive: tar.gz
            binary_name: ig
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive_name: macos-x86_64
            archive: tar.gz
            binary_name: ig
            extra_features: accelerate
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_name: macos-aarch64
            archive: tar.gz
            binary_name: ig
            extra_features: accelerate
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_name: windows-x86_64
            archive: zip
            binary_name: ig.exe
            cargo_flags: --no-default-features

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 29d00c7803f221f1b3f35e561b03792368fb8339 --locked

      - name: Build release binary
        run: |
          build_args=(--locked --release --target "$TARGET")
          if [ -n "$CARGO_FLAGS" ]; then
            read -r -a cargo_flags <<< "$CARGO_FLAGS"
            build_args+=("${cargo_flags[@]}")
          fi
          if [ -n "$EXTRA_FEATURES" ]; then
            build_args+=(--features "$EXTRA_FEATURES")
          fi
          if [ "$USE_CROSS" = "true" ]; then
            cross build "${build_args[@]}"
          else
            cargo build "${build_args[@]}"
          fi
        shell: bash

      - name: Set release artifact metadata
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ARCHIVE_NAME="ivygrep-${TAG}-${ARCHIVE_NAME_SUFFIX}"
          ARCHIVE_PATH="dist/${ARCHIVE_NAME}.${ARCHIVE_FORMAT}"
          {
            echo "ARCHIVE_NAME=${ARCHIVE_NAME}"
            echo "ARCHIVE_PATH=${ARCHIVE_PATH}"
            echo "BINARY_PATH=target/${TARGET}/release/${BINARY_NAME}"
            echo "PROVENANCE_PATH=dist/${ARCHIVE_NAME}.provenance.json"
            echo "SBOM_PATH=dist/${ARCHIVE_NAME}.spdx.json"
            echo "VERSION=${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Enforce release size budget
        shell: bash
        run: |
          PYTHON=python3
          if [[ "$TARGET" == *"windows"* ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/check_release_size.py "$BINARY_PATH" --max-mib 80

      - name: Build-output sanity check
        shell: bash
        env:
          IVYGREP_NO_AUTOSPAWN: "1"
        run: |
          if [[ "$TARGET" != *"windows"* ]]; then
            file "$BINARY_PATH"
          fi
          if [[ "$TARGET" != "aarch64-unknown-linux-musl" ]]; then
            "$BINARY_PATH" --version
            "$BINARY_PATH" --help > /dev/null
          fi

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          format: spdx-json
          output-file: dist/ivygrep-${{ github.ref_name }}-${{ matrix.archive_name }}.spdx.json
          upload-artifact: false

      - name: Package archive
        shell: bash
        run: |
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "$BINARY_PATH" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE* 2>/dev/null "dist/${ARCHIVE_NAME}/" || true
          cd dist
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi

      - name: Enforce archive size budget
        shell: bash
        run: |
          PYTHON=python3
          if [[ "$TARGET" == *"windows"* ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/check_release_size.py "$ARCHIVE_PATH" --max-mib 80

      - name: Compute checksum and provenance
        shell: bash
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            SHA=$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')
          else
            SHA=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')
          fi
          echo "${SHA}  $(basename "$ARCHIVE_PATH")" > "${ARCHIVE_PATH}.sha256"
          PYTHON=python3
          if [[ "$TARGET" == *"windows"* ]]; then
            PYTHON=python
          fi
          RUSTC_VERSION=$(rustc --version --verbose | tr '\n' ';')
          "$PYTHON" scripts/generate_release_provenance.py \
            --archive "$ARCHIVE_PATH" \
            --archive-root "$ARCHIVE_NAME" \
            --binary "$BINARY_PATH" \
            --sbom "$SBOM_PATH" \
            --target "$TARGET" \
            --features="$EXTRA_FEATURES" \
            --cargo-flags="$CARGO_FLAGS" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --rustc-version "$RUSTC_VERSION" \
            --output "$PROVENANCE_PATH"

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/ivygrep-${{ github.ref_name }}-${{ matrix.archive_name }}.${{ matrix.archive }}

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/ivygrep-${{ github.ref_name }}-${{ matrix.archive_name }}.${{ matrix.archive }}
          sbom-path: dist/ivygrep-${{ github.ref_name }}-${{ matrix.archive_name }}.spdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
            ${{ env.PROVENANCE_PATH }}
            ${{ env.SBOM_PATH }}
          retention-days: 30

  artifact-acceptance:
    name: Accept ${{ matrix.archive_name }} archive
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-x86_64-musl
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive_name: linux-aarch64-musl
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive_name: macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_name: macos-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_name: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivygrep-${{ github.ref_name }}-${{ matrix.archive_name }}
          path: release-artifact

      - name: Verify checksum, provenance, SBOM, and archive contents
        id: artifact
        shell: bash
        run: |
          NAME="ivygrep-${GITHUB_REF_NAME}-${{ matrix.archive_name }}"
          ARCHIVE=$(find release-artifact -name "${NAME}.${{ matrix.archive }}" -type f -print -quit)
          CHECKSUM=$(find release-artifact -name "${NAME}.${{ matrix.archive }}.sha256" -type f -print -quit)
          PROVENANCE=$(find release-artifact -name "${NAME}.provenance.json" -type f -print -quit)
          SBOM=$(find release-artifact -name "${NAME}.spdx.json" -type f -print -quit)
          PYTHON=python3
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/verify_release_artifact.py \
            --archive "$ARCHIVE" \
            --checksum "$CHECKSUM" \
            --provenance "$PROVENANCE" \
            --sbom "$SBOM" \
            --extract-dir "$PWD/release-extracted" \
            --expected-target "${{ matrix.target }}" \
            --expected-commit "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: arm64
          cache-image: false

      - name: Run exact archive procedures
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        env:
          BINARY: ${{ steps.artifact.outputs.binary }}
          HF_HOME: ${{ runner.temp }}/ivygrep-empty-hf-cache
          IVYGREP_NO_AUTOSPAWN: "1"
        run: |
          ./scripts/e2e_procedures.sh --binary "$BINARY"
          PYTHON=python3
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYTHON=python
          fi
          "$PYTHON" scripts/check_daemon_equivalence.py \
            --skip-build \
            --binary "$BINARY"

      - name: Run exact Linux aarch64 archive under QEMU
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        env:
          BINARY: ${{ steps.artifact.outputs.binary }}
        run: |
          BINARY_REL="${BINARY#"$PWD/"}"
          docker run --rm \
            --platform linux/arm64 \
            --network none \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e BINARY="/workspace/${BINARY_REL}" \
            -e IVYGREP_NO_AUTOSPAWN=1 \
            alpine:latest sh -c '
              set -eu
              sh scripts/e2e_procedures.sh --binary "$BINARY"
            '
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e BINARY="/workspace/${BINARY_REL}" \
            python:3.13-alpine sh -c '
              set -eu
              python3 scripts/check_daemon_equivalence.py \
                --skip-build \
                --binary "$BINARY" \
                --bench-home /tmp/ivygrep-release-daemon-equivalence
            '

      - name: Reject elevated x86 ISA requirements
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          BINARY: ${{ steps.artifact.outputs.binary }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          ./scripts/e2e_x86_baseline.sh --binary "$BINARY"

      - name: Prime and import cached neural model without network
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          BINARY: ${{ steps.artifact.outputs.binary }}
        run: |
          CACHE="$RUNNER_TEMP/ivygrep-release-hf-cache"
          ./scripts/e2e_cached_model.sh --binary "$BINARY" --cache "$CACHE"
          BINARY_REL="${BINARY#"$PWD/"}"
          docker run --rm \
            --network none \
            -v "$PWD:/workspace" \
            -v "$CACHE:/hf-cache" \
            -w /workspace \
            alpine:latest sh -c \
              "sh scripts/e2e_cached_model.sh --binary /workspace/${BINARY_REL} --cache /hf-cache"

  release:
    name: Create GitHub Release
    needs: artifact-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          find artifacts -name '*.sha256' -exec cp {} release-assets/ \;
          find artifacts -name '*.spdx.json' -exec cp {} release-assets/ \;
          find artifacts -name '*.provenance.json' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Extract Release Notes
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="[${VERSION}]" '/^## / { if (p) { exit }; if (index($2, ver)) { p=1; next } } p' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: ${{ steps.extract_notes.outputs.notes_file }}
          files: release-assets/*
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Compute SHA256 values
        id: sha
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          get_sha() {
            local pattern=$1
            local file
            file=$(find artifacts -name "${pattern}" -path '*.sha256' | head -1)
            if [ -f "$file" ]; then
              awk '{print $1}' "$file"
            else
              # Fallback: compute from the archive
              local archive
              archive=$(find artifacts -name "${pattern%.sha256}" | head -1)
              sha256sum "$archive" | awk '{print $1}'
            fi
          }

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha_linux_amd64_musl=$(get_sha "ivygrep-${TAG}-linux-x86_64-musl.tar.gz.sha256")"
            echo "sha_linux_arm64_musl=$(get_sha "ivygrep-${TAG}-linux-aarch64-musl.tar.gz.sha256")"
            echo "sha_macos_amd64=$(get_sha "ivygrep-${TAG}-macos-x86_64.tar.gz.sha256")"
            echo "sha_macos_arm64=$(get_sha "ivygrep-${TAG}-macos-aarch64.tar.gz.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bvolpato/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Generate formula (default — static/musl on Linux)
        shell: bash
        env:
          FORMULA_TAG: ${{ steps.sha.outputs.tag }}
          FORMULA_VERSION: ${{ steps.sha.outputs.version }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.sha_linux_amd64_musl }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.sha_linux_arm64_musl }}
          SHA_MACOS_AMD64: ${{ steps.sha.outputs.sha_macos_amd64 }}
          SHA_MACOS_ARM64: ${{ steps.sha.outputs.sha_macos_arm64 }}
        run: |
          cat > homebrew-tap/Formula/ivygrep.rb << FORMULA_EOF
          # typed: false
          # frozen_string_literal: true

          # This file is auto-generated by the ivygrep release workflow. DO NOT EDIT.
          class Ivygrep < Formula
            desc "Semantic grep for codebases — hybrid lexical + vector search, local-only"
            homepage "https://github.com/bvolpato/ivygrep"
            version "${FORMULA_VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_AMD64}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_ARM64}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-linux-x86_64-musl.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/bvolpato/ivygrep/releases/download/${FORMULA_TAG}/ivygrep-${FORMULA_TAG}-linux-aarch64-musl.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "ig"
            end

            test do
              (testpath/"hello.rs").write('fn hello() -> &str { "world" }')
              system "#{bin}/ig", "--help"
            end
          end
          FORMULA_EOF

      - name: Commit & push formulas
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.sha.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f Formula/ivygrep-static.rb Formula/ivygrep-gnu.rb 2>/dev/null || true
          git add Formula/ivygrep.rb
          if git diff --cached --quiet; then
            echo "Formulas already up to date, nothing to commit"
          else
            git commit -m "ivygrep ${RELEASE_TAG}: update formulas"
            git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bvolpato/homebrew-tap.git" HEAD:main
          fi
