name: Feature request
description: Propose a concrete ivygrep capability or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem. Implementation ideas are welcome but optional. Use [Discussions](https://github.com/bvolpato/ivygrep/discussions) for open-ended questions.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today? Who encounters it?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Show the command, MCP interaction, UI behavior, or result you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or related tools when relevant.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Indexing
        - Search relevance
        - Search performance
        - Context packs
        - CLI
        - MCP
        - Web UI
        - Platform support
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can preserve local-first operation and offline hash search.
          required: true
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I am willing to help implement or test this change.
          required: false
