# Static linking configuration for fully portable Linux binaries.
# The musl targets produce statically linked binaries with no glibc dependency,
# eliminating issues like missing libmvec.so.1 on older systems.
#
# In CI, we use `cross` which provides musl-native toolchains with a
# compatible libstdc++. Locally, you can also install a musl cross
# toolchain (e.g. x86_64-linux-musl-cross from musl.cc).

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# jemalloc, the allocator of the 64-bit musl builds, fixes its page size when
# it is built, and a cross build cannot ask the target. aarch64 kernels run
# with 4, 16, or 64 KiB pages, and a jemalloc built for smaller pages than the
# kernel uses aborts at startup ("Unsupported system page size"), so aarch64
# musl is built for 64 KiB. `tikv-jemalloc-sys` reads the variable with the
# target as prefix, so no other target is affected, and because Cargo sets it
# for the build script the value does not depend on how `cross` forwards the
# caller's environment. `ig hardware` reports the page size, and the release
# and E2E workflows assert it.
[env]
AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE = "16"
