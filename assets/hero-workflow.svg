<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ivygrep search and task context workflow</title>
  <desc id="description">One semantic code search followed by one bounded, branch-aware context command.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050913"/>
      <stop offset="0.52" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0715"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="18%" cy="20%" r="60%">
      <stop offset="0" stop-color="#19d67d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#19d67d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="82%" cy="80%" r="62%">
      <stop offset="0" stop-color="#8055ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8055ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ed686"/>
      <stop offset="0.52" stop-color="#3287f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#background)"/>
  <rect width="1600" height="900" rx="42" fill="url(#greenGlow)"/>
  <rect width="1600" height="900" rx="42" fill="url(#purpleGlow)"/>

  <g transform="translate(114 86)" filter="url(#shadow)">
    <rect width="1372" height="728" rx="28" fill="#0b0f19" stroke="#263142" stroke-width="3"/>
    <path d="M28 0h1316a28 28 0 0 1 28 28v62H0V28A28 28 0 0 1 28 0Z" fill="#111724"/>
    <circle cx="42" cy="44" r="12" fill="#ff6259"/>
    <circle cx="82" cy="44" r="12" fill="#ffbd45"/>
    <circle cx="122" cy="44" r="12" fill="#27c93f"/>
    <text x="686" y="54" fill="#8f9bad" font-size="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ivygrep · local repository</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">
      <text x="54" y="151" fill="#68758a"># one search for discovery</text>
      <text x="54" y="201" fill="#22d987">$</text>
      <text x="88" y="201" fill="#e9eef7">ig</text>
      <text x="136" y="201" fill="#ffc96b">"where is refresh token rotated?"</text>

      <text x="54" y="263" fill="#63c7ff">src/auth/refresh.rs:118</text>
      <text x="54" y="306" fill="#c6cfdd">fn </text>
      <text x="102" y="306" fill="#ffc96b">rotate_refresh_token</text>
      <text x="440" y="306" fill="#c6cfdd">(...) -&gt; Result&lt;Token&gt;</text>

      <line x1="54" y1="355" x2="1318" y2="355" stroke="#202b3b" stroke-width="2"/>

      <text x="54" y="414" fill="#68758a"># one bounded pack for implementation</text>
      <text x="54" y="466" fill="#22d987">$</text>
      <text x="88" y="466" fill="#e9eef7">ig context</text>
      <text x="286" y="466" fill="#ffc96b">"fix refresh-token races"</text>
      <text x="754" y="466" fill="#9eabbd">--since main --budget 8000</text>

      <rect x="54" y="510" width="1264" height="150" rx="18" fill="#0e1720" stroke="url(#edge)" stroke-width="2"/>
      <text x="86" y="565" fill="#22d987">✓ Context pack</text>
      <text x="336" y="565" fill="#e9eef7">14 snippets</text>
      <text x="570" y="565" fill="#68758a">/</text>
      <text x="608" y="565" fill="#e9eef7">7,642 tokens</text>
      <text x="850" y="565" fill="#68758a">/</text>
      <text x="888" y="565" fill="#e9eef7">3 changed files</text>
      <text x="86" y="620" fill="#63c7ff">definitions</text>
      <text x="298" y="620" fill="#68758a">·</text>
      <text x="334" y="620" fill="#63c7ff">callers</text>
      <text x="474" y="620" fill="#68758a">·</text>
      <text x="510" y="620" fill="#63c7ff">dependents</text>
      <text x="704" y="620" fill="#68758a">·</text>
      <text x="740" y="620" fill="#63c7ff">tests</text>
      <text x="846" y="620" fill="#68758a">·</text>
      <text x="882" y="620" fill="#63c7ff">configuration</text>
    </g>

    <text x="54" y="700" fill="#78869b" font-size="22" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Exact paths and lines · selection reason · relationship · everything local</text>
    <text x="1318" y="700" fill="#22d987" font-size="24" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">ivygrep</text>
  </g>
</svg>
