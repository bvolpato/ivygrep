frequency = ["freq"]
handled = ["handle", "handler"]
handling = ["handle", "handler"]
lookup = ["find", "resolve"]
processing = ["handler", "process"]
queued = ["dispatch", "enqueue", "queue"]
queueing = ["dispatch", "enqueue", "queue"]
receive = ["ingress", "recv", "rx"]
received = ["ingress", "recv", "rx"]
receiving = ["ingress", "recv", "rx"]
reusable = ["cache", "pool"]
scheduler = ["sched"]
tracked = ["account", "track"]
tracking = ["account", "track"]

[phrase]
"block io" = ["block_io"]
"command line" = ["cli"]
"line number" = ["line_number"]
"memory object" = ["allocator", "pool", "slab"]
