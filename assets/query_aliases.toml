# Query expansion aliases used by code search relevance.
#
# Keep this file generic: aliases must describe common code-search vocabulary,
# not names from one repository or benchmark corpus.

[token]
implemented = ["implement"]
implementing = ["implement"]
implementation = ["implement"]
implements = ["implement"]

declared = ["define"]
declaration = ["define"]
defined = ["define"]
defining = ["define"]
definition = ["define"]
definitions = ["define"]

detected = ["detect"]
detecting = ["detect"]
detection = ["detect"]
detector = ["detect"]

ranked = ["rank"]
ranking = ["rank"]
scoring = ["score", "rank"]
scores = ["score", "rank"]
results = ["result"]
chunking = ["chunk"]

arg = ["cli", "flag", "option"]
args = ["cli", "flag", "option"]
argument = ["cli", "flag", "option"]
arguments = ["cli", "flag", "option"]
flag = ["cli", "arg", "option"]
flags = ["cli", "arg", "option"]
command = ["cli"]

grammar = ["parse", "parser"]
parsing = ["parse", "parser"]
matching = ["match", "matcher"]
counting = ["count", "counter"]
counts = ["count", "counter"]
indexed = ["index"]
indexing = ["index"]
dictionaries = ["dictionary"]
policies = ["policy"]
output = ["print", "printer"]
colored = ["color"]
coloring = ["color"]
walker = ["walk"]

[phrase]
"command line" = ["cli"]
"line number" = ["line_number"]
"output format" = ["printer"]
"result output" = ["printer"]
