# Query expansion aliases used by code search relevance.
#
# Keep this file generic: aliases must describe common code-search vocabulary,
# not names from one repository or benchmark corpus.

[token]
implemented = ["implement"]
implementing = ["implement"]
implementation = ["implement"]
implements = ["implement"]

declared = ["define"]
declaration = ["define"]
defined = ["define"]
defining = ["define"]
definition = ["define"]
definitions = ["define"]

detected = ["detect"]
detecting = ["detect"]
detection = ["detect"]
detector = ["detect"]

ranked = ["rank"]
ranking = ["rank"]
scoring = ["score", "rank"]
scores = ["score", "rank"]
results = ["result"]
chunking = ["chunk"]

grammar = ["parse", "parser"]
parsing = ["parse", "parser"]
matching = ["match", "matcher"]
counting = ["count", "counter"]
counts = ["count", "counter"]
indexed = ["index"]
indexing = ["index"]
dictionaries = ["dictionary"]
policies = ["policy"]
colored = ["color"]
coloring = ["color"]

allocated = ["allocate", "allocator"]
allocating = ["allocate", "allocator"]
allocation = ["allocate", "allocator"]
background = ["worker"]
checked = ["check", "validate", "verify", "verifier"]
checking = ["check", "validate", "verify", "verifier"]
choose = ["pick", "select"]
